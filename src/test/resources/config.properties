# Shadows src/main/resources/config.properties, but with test values. It's needed to make possible to change
#   original config and at the same time not to fail tests, which contain hardcoded values.
# Values also must differ to be sure that the test config is actually being used.
db.url=jdbc:postgresql://test-host:5432/test-db
db.user=test-user
db.password=test-password
queue.capacity=11
producer.thread.pool.size=3
consumer.thread.pool.size=5
batch.size=7
shop.entry.target=13
type.increase.coefficient=2
max.stock.quantity=17
invalid.rate.percent=19
recreate.schema=false
